<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gemini Core AI Gradient (Refined Google Colors) -->
    <linearGradient id="gemini-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1FA2FF" />
      <stop offset="40%" stop-color="#9D4EDD" />
      <stop offset="75%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#F9D423" />
    </linearGradient>

    <!-- Claude Code Coral Accent Gradient (For Brackets) -->
    <linearGradient id="claude-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E28670" />
      <stop offset="100%" stop-color="#C25A42" />
    </linearGradient>

    <!-- Optional soft glow for the star -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Code Bracket (Claude Code Accent) -->
  <path d="M 170 146
           L 30 256
           L 170 366" 
        fill="none" 
        stroke="url(#claude-grad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Code Bracket (Claude Code Accent) -->
  <path d="M 342 146
           L 482 256
           L 342 366" 
        fill="none" 
        stroke="url(#claude-grad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Minimal Gemini Spark -->
  <g transform="translate(256, 256) scale(2.4)" filter="url(#soft-glow)">
    <path d="M 0 -45
             C 4 -15, 15 -4, 45 0
             C 15 4, 4 15, 0 45
             C -4 15, -15 4, -45 0
             C -15 -4, -4 -15, 0 -45 Z" 
          fill="url(#gemini-grad)" />
  </g>
</svg>
