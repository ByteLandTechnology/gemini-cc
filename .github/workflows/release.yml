name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run verify

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check -- --tag "${GITHUB_REF_NAME}"

      - name: Stage release bundle
        run: npm run release:bundle

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: gemini-cc-v${{ steps.version.outputs.value }}
          path: |
            dist/release/gemini-cc-v${{ steps.version.outputs.value }}
            dist/release/gemini-cc-v${{ steps.version.outputs.value }}.tar.gz
            dist/release/gemini-cc-v${{ steps.version.outputs.value }}.sha256
            dist/release/gemini-cc-v${{ steps.version.outputs.value }}.release-notes.md
            dist/release/gemini-cc-v${{ steps.version.outputs.value }}.manifest.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="dist/release/gemini-cc-v${{ steps.version.outputs.value }}.release-notes.md"
          TAR="dist/release/gemini-cc-v${{ steps.version.outputs.value }}.tar.gz"
          SUM="dist/release/gemini-cc-v${{ steps.version.outputs.value }}.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$NOTES" --title "gemini-cc v${{ steps.version.outputs.value }}"
          else
            gh release create "${GITHUB_REF_NAME}" "$TAR" "$SUM" --notes-file "$NOTES" --title "gemini-cc v${{ steps.version.outputs.value }}"
          fi
          gh release upload "${GITHUB_REF_NAME}" "$TAR" "$SUM" --clobber
